<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" id="ecodetetive-svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="eco-coat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FB" />
      <stop offset="50%" stop-color="#E8E6F8" />
      <stop offset="100%" stop-color="#D8D4ED" />
    </linearGradient>
    <linearGradient id="eco-hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5BB0" />
      <stop offset="100%" stop-color="#3C3489" />
    </linearGradient>
    <linearGradient id="eco-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#B3E5FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE5C3" />
      <stop offset="100%" stop-color="#FFCFA0" />
    </linearGradient>
    <filter id="shadow-filter">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="ecodetetive-character">
    <!-- Shadow -->
    <ellipse cx="100" cy="190" rx="48" ry="8" fill="rgba(0,0,0,0.15)" />

    <!-- Legs (Improved) -->
    <g id="eco-legs">
      <path d="M 82 155 L 82 180" stroke="#3C3489" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M 118 155 L 118 180" stroke="#3C3489" stroke-width="13" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Feet (Shoes - Improved) -->
    <g id="shoes" filter="url(#shadow-filter)">
      <ellipse cx="82" cy="182" rx="11" ry="8" fill="#2C2C2C" />
      <path d="M 76 182 L 88 182 L 88 185 Q 82 187 76 185 Z" fill="#1a1a1a" />
      <ellipse cx="118" cy="182" rx="11" ry="8" fill="#2C2C2C" />
      <path d="M 112 182 L 124 182 L 124 185 Q 118 187 112 185 Z" fill="#1a1a1a" />
    </g>

    <!-- Body (Lab Coat - Enhanced) -->
    <path id="eco-coat" d="M 58 78 Q 48 115 52 158 L 148 158 Q 152 115 142 78 Z" fill="url(#eco-coat-grad)" stroke="#534AB7" stroke-width="2.5" filter="url(#shadow-filter)" />
    
    <!-- Coat Shine/Highlight -->
    <ellipse cx="100" cy="95" rx="20" ry="35" fill="#FFFFFF" opacity="0.25" />
    
    <!-- Coat Collar / Lapels -->
    <path d="M 85 78 L 100 115 L 115 78 Z" fill="#C4BAEB" />
    <path d="M 85 78 L 72 105 L 92 105 Z" fill="#F0EEF9" stroke="#D8D4ED" stroke-width="1.5"/>
    <path d="M 115 78 L 128 105 L 108 105 Z" fill="#F0EEF9" stroke="#D8D4ED" stroke-width="1.5"/>
    
    <!-- Tie underneath -->
    <polygon points="95,78 105,78 100,110" fill="#2D2460" />
    <polygon points="96,80 104,80 100,108" fill="#3C3489" />
    
    <!-- Coat Center Line -->
    <line x1="100" y1="115" x2="100" y2="158" stroke="#C4BAEB" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.8"/>
    
    <!-- Coat Buttons -->
    <g id="buttons" opacity="0.7">
      <circle cx="100" cy="100" r="3.5" fill="#534AB7" stroke="#3C3489" stroke-width="1" />
      <circle cx="100" cy="115" r="3.5" fill="#534AB7" stroke="#3C3489" stroke-width="1" />
      <circle cx="100" cy="130" r="3.5" fill="#534AB7" stroke="#3C3489" stroke-width="1" />
      <circle cx="100" cy="145" r="3.5" fill="#534AB7" stroke="#3C3489" stroke-width="1" />
    </g>
    
    <!-- Coat Pockets (Improved) -->
    <g id="pockets">
      <rect x="64" y="123" width="22" height="28" rx="2.5" fill="none" stroke="#D8D4ED" stroke-width="2.5" />
      <line x1="64" y1="129" x2="86" y2="129" stroke="#D8D4ED" stroke-width="1.5" opacity="0.6"/>
      <circle cx="75" cy="140" r="2" fill="#AFA9EC" opacity="0.4" />
      
      <rect x="114" y="123" width="22" height="28" rx="2.5" fill="none" stroke="#D8D4ED" stroke-width="2.5" />
      <line x1="114" y1="129" x2="136" y2="129" stroke="#D8D4ED" stroke-width="1.5" opacity="0.6"/>
      <circle cx="125" cy="140" r="2" fill="#AFA9EC" opacity="0.4" />
    </g>

    <!-- Head -->
    <ellipse cx="100" cy="55" rx="28" ry="30" fill="url(#skin-grad)" filter="url(#shadow-filter)" />
    <!-- Head highlight -->
    <ellipse cx="92" cy="35" rx="10" ry="15" fill="#FFFFFF" opacity="0.3" />

    <!-- Neck -->
    <rect x="92" y="78" width="16" height="10" fill="url(#skin-grad)" opacity="0.8" />

    <!-- Face -->
    <g id="eco-face">
      <!-- Eyebrows (Expressive) -->
      <path d="M 78 45 Q 84 41 90 43" fill="none" stroke="#3C3489" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 110 43 Q 116 41 122 45" fill="none" stroke="#3C3489" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Glasses (Detective) -->
      <g id="left-glass" filter="url(#shadow-filter)">
        <circle cx="85" cy="55" r="13" fill="url(#eco-glass-grad)" stroke="#534AB7" stroke-width="3" />
        <circle cx="85" cy="55" r="13" fill="none" stroke="#3C3489" stroke-width="1" opacity="0.5" />
      </g>
      <g id="right-glass" filter="url(#shadow-filter)">
        <circle cx="115" cy="55" r="13" fill="url(#eco-glass-grad)" stroke="#534AB7" stroke-width="3" />
        <circle cx="115" cy="55" r="13" fill="none" stroke="#3C3489" stroke-width="1" opacity="0.5" />
      </g>
      
      <!-- Glasses bridge -->
      <line x1="98" y1="55" x2="102" y2="55" stroke="#534AB7" stroke-width="2.5" stroke-linecap="round" />
      <!-- Glasses nose piece -->
      <circle cx="100" cy="58" r="2" fill="#534AB7" opacity="0.6" />
      
      <!-- Glass highlights -->
      <ellipse cx="81" cy="48" rx="5" ry="6" fill="#FFFFFF" opacity="0.6" />
      <ellipse cx="111" cy="48" rx="5" ry="6" fill="#FFFFFF" opacity="0.6" />
      
      <!-- Eyes behind glasses -->
      <circle cx="85" cy="55" r="5" fill="#3C3489" />
      <circle cx="86" cy="53" r="2" fill="#FFF" />
      <circle cx="115" cy="55" r="5" fill="#3C3489" />
      <circle cx="116" cy="53" r="2" fill="#FFF" />
      
      <!-- Mustache (Detective) -->
      <path d="M 85 67 Q 100 70 115 67 Q 100 72 85 67 Z" fill="#3C3489" />
      <path d="M 88 68 Q 100 69 112 68" fill="none" stroke="#534AB7" stroke-width="0.5" opacity="0.5" />

      <!-- Mouth (Friendly smile) -->
      <path d="M 94 75 Q 100 80 106 75" fill="none" stroke="#3C3489" stroke-width="2" stroke-linecap="round" />
      <path d="M 96 76 Q 100 78 104 76" fill="none" stroke="#FFB8A3" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Hat (Detective fedora - Enhanced) -->
    <g id="eco-hat" filter="url(#shadow-filter)">
      <!-- Back brim shadow -->
      <path d="M 62 32 Q 100 20 138 32" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="12" stroke-linecap="round" />
      <!-- Back brim -->
      <path d="M 63 31 Q 100 19 137 31" fill="none" stroke="#3C3489" stroke-width="10" stroke-linecap="round" />
      
      <!-- Hat dome -->
      <path d="M 72 31 C 72 2, 128 2, 128 31 Z" fill="url(#eco-hat-grad)" />
      <!-- Hat dome shine -->
      <ellipse cx="100" cy="12" rx="18" ry="12" fill="#FFFFFF" opacity="0.25" />
      
      <!-- Hat band (ribbon) -->
      <ellipse cx="100" cy="28" rx="58" ry="6" fill="#2D2460" opacity="0.8" />
      <ellipse cx="100" cy="27" rx="58" ry="4" fill="#AFA9EC" />
      <path d="M 75 27 Q 100 32 125 27" fill="none" stroke="#D8D4ED" stroke-width="1" opacity="0.6" />
      
      <!-- Front brim -->
      <path d="M 57 31 Q 100 45 143 31" fill="none" stroke="#534AB7" stroke-width="10" stroke-linecap="round" />
      <path d="M 58 32 Q 100 44 142 32" fill="none" stroke="#6B5BB0" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Arms -->
    <!-- Left Arm (pointing up / explaining) -->
    <g id="left-arm-group">
      <path d="M 60 82 Q 35 88 32 115" fill="none" stroke="#F5F3FB" stroke-width="14" stroke-linecap="round" />
      <path d="M 60 82 Q 35 88 32 115" fill="none" stroke="#D8D4ED" stroke-width="8" stroke-linecap="round" opacity="0.7" />
      <!-- Sleeve cuff -->
      <circle cx="60" cy="82" r="8" fill="#C4BAEB" stroke="#AFA9EC" stroke-width="1" />
    </g>
    
    <!-- Right Arm (holding magnifying glass) -->
    <g id="right-arm-group">
      <path d="M 140 82 Q 165 95 158 135" fill="none" stroke="#F5F3FB" stroke-width="14" stroke-linecap="round" />
      <path d="M 140 82 Q 165 95 158 135" fill="none" stroke="#D8D4ED" stroke-width="8" stroke-linecap="round" opacity="0.7" />
      <!-- Sleeve cuff -->
      <circle cx="140" cy="82" r="8" fill="#C4BAEB" stroke="#AFA9EC" stroke-width="1" />
    </g>

    <!-- Hands -->
    <!-- Left Hand (pointing finger) -->
    <g id="hand-left" filter="url(#shadow-filter)">
      <ellipse cx="32" cy="115" rx="7" ry="8" fill="url(#skin-grad)" />
      <path d="M 28 108 L 26 98 A 2.5 2.5 0 0 1 30 98 L 28 110 Z" fill="url(#skin-grad)" />
      <path d="M 32 108 L 32 95 A 2.5 2.5 0 0 1 36 95 L 36 110 Z" fill="url(#skin-grad)" />
      <path d="M 36 108 L 38 100 A 2.5 2.5 0 0 1 42 102 L 38 110 Z" fill="url(#skin-grad)" />
    </g>
    
    <!-- Right Hand (holding glass) -->
    <g id="hand-right" filter="url(#shadow-filter)">
      <ellipse cx="158" cy="135" rx="8" ry="9" fill="url(#skin-grad)" />
      <!-- Fingers gripping -->
      <path d="M 152 132 L 148 125 A 2.5 2.5 0 0 1 152 124 L 154 132 Z" fill="url(#skin-grad)" />
      <path d="M 158 130 L 158 115 A 2.5 2.5 0 0 1 162 115 L 162 132 Z" fill="url(#skin-grad)" />
      <path d="M 164 132 L 168 124 A 2.5 2.5 0 0 1 172 126 L 166 134 Z" fill="url(#skin-grad)" />
    </g>

    <!-- Magnifying Glass (Enhanced) -->
    <g id="eco-magnifier" filter="url(#shadow-filter)">
      <!-- Handle -->
      <path d="M 158 135 L 175 100" stroke="#3C3489" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 158 135 L 175 100" stroke="#6B5BB0" stroke-width="4" stroke-linecap="round" fill="none" />
      
      <!-- Rim (outer) -->
      <circle cx="155" cy="65" r="22" fill="none" stroke="#3C3489" stroke-width="6" />
      <circle cx="155" cy="65" r="22" fill="none" stroke="#6B5BB0" stroke-width="2" opacity="0.7" />
      
      <!-- Glass lens -->
      <circle cx="155" cy="65" r="20" fill="url(#eco-glass-grad)" />
      <circle cx="155" cy="65" r="20" fill="none" stroke="#B3E5FC" stroke-width="0.5" opacity="0.5" />
      
      <!-- Glass shine (top-left) -->
      <ellipse cx="142" cy="50" rx="9" ry="11" fill="#FFFFFF" opacity="0.7" />
      <!-- Glass shine (inner) -->
      <circle cx="158" cy="62" r="6" fill="#FFFFFF" opacity="0.4" />
      
      <!-- Magnified crosshairs for detective feel -->
      <line x1="155" y1="50" x2="155" y2="80" stroke="#AFA9EC" stroke-width="1" opacity="0.3" />
      <line x1="140" y1="65" x2="170" y2="65" stroke="#AFA9EC" stroke-width="1" opacity="0.3" />
    </g>
  </g>
</svg>
