<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" id="ecodetetive-svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="eco-coat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8E6F8" /> <!-- Very light version of #AFA9EC -->
    </linearGradient>
    <linearGradient id="eco-hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#534AB7" />
      <stop offset="100%" stop-color="#3C3489" />
    </linearGradient>
    <linearGradient id="eco-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#AFA9EC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <g id="ecodetetive-character">
    <!-- Shadow -->
    <ellipse cx="100" cy="185" rx="45" ry="10" fill="rgba(0,0,0,0.2)" />

    <!-- Legs -->
    <g id="eco-legs" stroke="#3C3489" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M 85 150 L 85 175" />
      <path d="M 115 150 L 115 175" />
    </g>

    <!-- Feet (Shoes) -->
    <path d="M 70 180 L 90 180 A 5 5 0 0 0 85 170 L 75 170 Z" fill="#222" />
    <path d="M 110 180 L 130 180 A 5 5 0 0 0 125 170 L 115 170 Z" fill="#222" />

    <!-- Body (Lab Coat) -->
    <path id="eco-coat" d="M 60 75 Q 50 120 55 160 L 145 160 Q 150 120 140 75 Z" fill="url(#eco-coat-grad)" stroke="#534AB7" stroke-width="3" />
    
    <!-- Coat Collar / Lapels -->
    <path d="M 85 75 L 100 110 L 115 75 Z" fill="#AFA9EC" />
    <path d="M 85 75 L 75 100 L 95 100 Z" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1"/>
    <path d="M 115 75 L 125 100 L 105 100 Z" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1"/>
    
    <!-- Tie underneath -->
    <polygon points="95,75 105,75 100,105" fill="#3C3489" />
    
    <!-- Coat Center Line -->
    <line x1="100" y1="110" x2="100" y2="160" stroke="#534AB7" stroke-width="2" stroke-dasharray="8 4" />
    
    <!-- Coat Pockets -->
    <rect x="65" y="125" width="20" height="25" rx="2" fill="none" stroke="#AFA9EC" stroke-width="3" />
    <line x1="65" y1="130" x2="85" y2="130" stroke="#AFA9EC" stroke-width="2" />
    <rect x="115" y="125" width="20" height="25" rx="2" fill="none" stroke="#AFA9EC" stroke-width="3" />
    <line x1="115" y1="130" x2="135" y2="130" stroke="#AFA9EC" stroke-width="2" />

    <!-- Head -->
    <ellipse cx="100" cy="58" rx="26" ry="26" fill="#FFDDBB" />

    <!-- Face -->
    <g id="eco-face">
      <!-- Eyes -->
      <circle cx="90" cy="58" r="4" fill="#3C3489" />
      <circle cx="91" cy="56" r="1.5" fill="#FFF" />
      <circle cx="110" cy="58" r="4" fill="#3C3489" />
      <circle cx="111" cy="56" r="1.5" fill="#FFF" />
      
      <!-- Glasses (Detetive) -->
      <circle cx="90" cy="58" r="11" fill="none" stroke="#534AB7" stroke-width="3" />
      <circle cx="110" cy="58" r="11" fill="none" stroke="#534AB7" stroke-width="3" />
      <line x1="101" y1="58" x2="99" y2="58" stroke="#534AB7" stroke-width="3" /> <!-- bridge -->
      
      <!-- Mustache / Detetive Look (Optional, adds character) -->
      <path d="M 90 68 Q 100 65 110 68 Q 100 70 90 68 Z" fill="#3C3489" />

      <!-- Mouth -->
      <path d="M 96 72 Q 100 75 104 72" fill="none" stroke="#3C3489" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Hat (Detective fedora/deerstalker style) -->
    <g id="eco-hat">
      <!-- Back brim -->
      <path d="M 65 35 Q 100 25 135 35" fill="none" stroke="#3C3489" stroke-width="8" stroke-linecap="round" />
      <!-- Hat dome -->
      <path d="M 73 35 C 73 5, 127 5, 127 35 Z" fill="url(#eco-hat-grad)" />
      <!-- Hat band -->
      <path d="M 72 30 C 85 35, 115 35, 128 30 L 127 35 C 115 40, 85 40, 73 35 Z" fill="#AFA9EC" />
      <!-- Front brim -->
      <path d="M 60 35 Q 100 45 140 35" fill="none" stroke="url(#eco-hat-grad)" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Arms -->
    <!-- Left Arm (pointing up / explaining) -->
    <path id="arm-left" d="M 62 85 Q 40 90 45 110 Q 50 120 40 100" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <!-- Adding a sleeve outline -->
    <path d="M 62 85 Q 40 90 45 110" fill="none" stroke="#AFA9EC" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Right Arm (holding magnifying glass) -->
    <path id="arm-right" d="M 138 85 Q 160 100 145 125" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <path d="M 138 85 Q 160 100 145 125" fill="none" stroke="#AFA9EC" stroke-width="12" stroke-linecap="round" opacity="0.6"/>

    <!-- Hands -->
    <!-- Left Hand (pointing finger) -->
    <g id="hand-left" transform="translate(45, 110)">
      <circle cx="0" cy="0" r="6" fill="#FFDDBB" />
      <path d="M -2 -5 L -2 -12 A 2 2 0 0 1 2 -12 L 2 -4 Z" fill="#FFDDBB" />
    </g>
    <!-- Right Hand -->
    <circle cx="145" cy="125" r="7" fill="#FFDDBB" />

    <!-- Magnifying Glass -->
    <g id="eco-magnifier" transform="translate(145, 125)">
      <!-- Handle -->
      <line x1="0" y1="0" x2="-15" y2="-25" stroke="#3C3489" stroke-width="7" stroke-linecap="round" />
      <line x1="0" y1="0" x2="-15" y2="-25" stroke="#534AB7" stroke-width="3" stroke-linecap="round" />
      <!-- Rim -->
      <circle cx="-25" cy="-38" r="16" fill="none" stroke="#3C3489" stroke-width="5" />
      <circle cx="-25" cy="-38" r="16" fill="none" stroke="#534AB7" stroke-width="2" />
      <!-- Glass -->
      <circle cx="-25" cy="-38" r="14" fill="url(#eco-glass-grad)" />
      <!-- Highlight -->
      <path d="M -34 -47 A 11 11 0 0 1 -16 -47" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>
</svg>
