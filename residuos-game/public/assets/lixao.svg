<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" id="lixao-svg">
  <defs>
    <!-- Gradients -->
    <radialGradient id="lixao-body-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#993C1D" />
      <stop offset="100%" stop-color="#3A1207" />
    </radialGradient>
    <radialGradient id="lixao-eye-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="30%" stop-color="#E24B4A" />
      <stop offset="100%" stop-color="#712B13" />
    </radialGradient>
    <filter id="lixao-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="lixao-character">
    <!-- Shadow -->
    <ellipse cx="100" cy="170" rx="60" ry="15" fill="rgba(0,0,0,0.3)" />

    <!-- Main Body Group -->
    <g id="lixao-body-group" class="idle-anim">
      <!-- Trash bag bottom bulges -->
      <path d="M 30 150 C 10 150, 20 90, 50 80 C 50 80, 50 140, 30 150 Z" fill="#2A0C04" />
      <path d="M 170 150 C 190 150, 180 90, 150 80 C 150 80, 150 140, 170 150 Z" fill="#2A0C04" />
      
      <!-- Main body mass -->
      <path id="lixao-body" d="M 40 160 C 20 150, 30 80, 70 50 C 85 40, 115 40, 130 50 C 170 80, 180 150, 160 160 C 140 170, 60 170, 40 160 Z" fill="url(#lixao-body-grad)" stroke="#712B13" stroke-width="3" />
      
      <!-- Bag knot / tied top -->
      <path d="M 85 50 C 70 20, 95 10, 100 20 C 105 10, 130 20, 115 50 Z" fill="#5A1D0B" stroke="#712B13" stroke-width="2" />
      <!-- Knot tie wrapper -->
      <rect x="85" y="45" width="30" height="10" rx="3" fill="#E24B4A" />

      <!-- Creases / Wrinkles -->
      <path d="M 70 155 C 60 120, 80 100, 75 70" stroke="#3A1207" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M 130 155 C 140 120, 120 100, 125 70" stroke="#3A1207" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M 100 160 C 95 140, 105 130, 100 110" stroke="#3A1207" stroke-width="3" fill="none" stroke-linecap="round" />

      <!-- Evil Eyes -->
      <g id="lixao-eyes" filter="url(#lixao-glow)">
        <!-- Left Eye (angled inwards) -->
        <polygon points="60,90 90,105 75,115" fill="url(#lixao-eye-grad)" />
        <circle cx="78" cy="105" r="4" fill="#FFF" />
        
        <!-- Right Eye (angled inwards) -->
        <polygon points="140,90 110,105 125,115" fill="url(#lixao-eye-grad)" />
        <circle cx="122" cy="105" r="4" fill="#FFF" />
      </g>

      <!-- Mouth / Sludge Drip -->
      <path id="lixao-mouth" d="M 70 135 Q 100 125 130 135 Q 120 150 100 150 Q 80 150 70 135 Z" fill="#110502" />
      <path d="M 80 135 Q 90 145 100 135 Q 110 145 120 135" stroke="#E24B4A" stroke-width="2" fill="none" />
      
      <!-- Sludge drips -->
      <path d="M 60 155 Q 65 175 60 180 Q 55 175 60 155" fill="#712B13" />
      <path d="M 140 158 Q 145 170 140 175 Q 135 170 140 158" fill="#712B13" />
    </g>
  </g>
</svg>
