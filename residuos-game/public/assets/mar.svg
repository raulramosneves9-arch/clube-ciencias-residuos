<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" id="mar-svg">
  <!-- critico -->
  <g id="estado-critico" display="none">
    <rect width="400" height="200" fill="#2E3B32" />
    <path d="M 0 100 Q 100 80 200 120 T 400 100 L 400 200 L 0 200 Z" fill="#1A251E" />
    <path d="M 180 110 Q 190 100 200 110" stroke="#000" stroke-width="4" fill="none" />
    <path d="M 200 110 Q 210 100 220 110" stroke="#000" stroke-width="4" fill="none" />
    <path d="M 190 130 Q 200 120 210 130" stroke="#000" stroke-width="4" fill="none" />
    <line x1="185" y1="115" x2="185" y2="135" stroke="#4CB8FF" stroke-width="4" stroke-dasharray="4 4"/>
    <line x1="215" y1="115" x2="215" y2="135" stroke="#4CB8FF" stroke-width="4" stroke-dasharray="4 4"/>
    <rect x="50" y="110" width="20" height="20" fill="#8B4513" transform="rotate(15 50 110)" />
    <circle cx="300" cy="140" r="15" fill="#555" />
    <rect x="330" y="100" width="30" height="15" fill="#E24B4A" />
    <path d="M 100 150 L 120 160 L 110 170 Z" fill="#FFD700" />
  </g>
  
  <!-- ruim -->
  <g id="estado-ruim" display="none">
    <rect width="400" height="200" fill="#3A5B52" />
    <path d="M 0 100 Q 100 80 200 120 T 400 100 L 400 200 L 0 200 Z" fill="#2A4B42" />
    <circle cx="185" cy="110" r="5" fill="#111" />
    <circle cx="215" cy="110" r="5" fill="#111" />
    <path d="M 190 135 Q 200 125 210 135" stroke="#111" stroke-width="4" fill="none" />
    <rect x="80" y="130" width="15" height="15" fill="#8B4513" />
    <circle cx="280" cy="120" r="10" fill="#555" />
  </g>

  <!-- neutro -->
  <g id="estado-neutro" display="block">
    <rect width="400" height="200" fill="#4A7B72" />
    <path d="M 0 100 Q 100 80 200 110 T 400 100 L 400 200 L 0 200 Z" fill="#3A6B62" />
    <circle cx="185" cy="110" r="5" fill="#111" />
    <circle cx="215" cy="110" r="5" fill="#111" />
    <line x1="190" y1="130" x2="210" y2="130" stroke="#111" stroke-width="4" />
    <rect x="100" y="140" width="10" height="10" fill="#8B4513" />
  </g>

  <!-- bom -->
  <g id="estado-bom" display="none">
    <rect width="400" height="200" fill="#4A9CD2" />
    <path d="M 0 100 Q 100 90 200 110 T 400 100 L 400 200 L 0 200 Z" fill="#3A8CC2" />
    <circle cx="185" cy="110" r="5" fill="#111" />
    <circle cx="215" cy="110" r="5" fill="#111" />
    <path d="M 190 125 Q 200 135 210 125" stroke="#111" stroke-width="4" fill="none" />
  </g>

  <!-- otimo -->
  <g id="estado-otimo" display="none">
    <rect width="400" height="200" fill="#1DA1F2" />
    <path d="M 0 100 Q 100 90 200 110 T 400 100 L 400 200 L 0 200 Z" fill="#0D91E2" />
    <path d="M 180 110 Q 185 100 190 110" stroke="#111" stroke-width="4" fill="none" />
    <path d="M 210 110 Q 215 100 220 110" stroke="#111" stroke-width="4" fill="none" />
    <path d="M 185 125 Q 200 145 215 125 Z" fill="#111" />
    <path d="M 190 135 Q 200 140 210 135 Z" fill="#FF7788" />
    <path d="M 100 60 L 105 70 L 115 75 L 105 80 L 100 90 L 95 80 L 85 75 L 95 70 Z" fill="#FFF" />
    <path d="M 300 80 L 303 86 L 309 89 L 303 92 L 300 98 L 297 92 L 291 89 L 297 86 Z" fill="#FFF" />
  </g>
</svg>
